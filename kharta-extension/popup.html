<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Kharta</title>
  <style>
    body {
      width: 340px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      color: #1a1a1a;
    }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .status { font-size: 12px; color: #666; margin-bottom: 10px; }

    /* Mode toggle — Feature 1 */
    .mode-toggle {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }
    .mode-btn {
      flex: 1;
      padding: 5px 4px;
      font-size: 12px;
      background: #f0f0f0;
      color: #555;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      width: auto;
      margin-bottom: 0;
      box-sizing: border-box;
    }
    .mode-btn.active {
      background: #1a1a2e;
      color: white;
      border-color: #1a1a2e;
    }

    select {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      box-sizing: border-box;
    }
    #extractBtn, #signInBtn {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      box-sizing: border-box;
      cursor: pointer;
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 4px;
    }
    #extractBtn:disabled, #signInBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #result {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
      line-height: 1.5;
    }
    .privacy-note {
      font-size: 11px;
      color: #888;
      margin-top: 12px;
      line-height: 1.4;
    }
    a { color: #1a1a2e; }
  </style>
</head>
<body>
  <h1>Kharta — Score this page</h1>
  <div class="status" id="status">Checking sign-in…</div>

  <div id="signedOutView" style="display:none;">
    <button id="signInBtn">Sign in to Kharta</button>
  </div>

  <div id="signedInView" style="display:none;">
    <!-- Feature 1: mode toggle -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeScoreBtn">Score Candidate</button>
      <button class="mode-btn" id="modeRoleBtn">Save as Role</button>
    </div>

    <!-- Hidden in "Save as Role" mode -->
    <div id="roleRow">
      <select id="roleSelect">
        <option value="">Loading your open roles…</option>
      </select>
    </div>

    <button id="extractBtn">Extract &amp; Score This Page</button>
  </div>

  <div id="result"></div>

  <div class="privacy-note">
    Nothing on this page is read until you click the button.
    Only visible text is sent, only to your Kharta workspace.
  </div>

  <script src="pdf.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
