name: Resume parser tests

on:
  push:
    paths:
      - "services/resume-parser/**"
      - ".github/workflows/resume-parser.yml"
  pull_request:
    paths:
      - "services/resume-parser/**"
      - ".github/workflows/resume-parser.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/resume-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-minimal.txt
      - name: Smoke import
        env:
          KARTA_SKIP_PRESIDIO: "1"
        run: python -c "from app.pipeline.ingestion import ingest_from_text; print('import ok')"
      - name: Run tests
        env:
          KARTA_SKIP_PRESIDIO: "1"
        run: python -m pytest -v --tb=short
