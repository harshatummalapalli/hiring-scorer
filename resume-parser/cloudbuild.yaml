steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/karta-resume-parser:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/karta-resume-parser:latest
      - .
    dir: resume-parser

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - gcr.io/$PROJECT_ID/karta-resume-parser:$COMMIT_SHA

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - run
      - deploy
      - karta-resume-parser
      - --image=gcr.io/$PROJECT_ID/karta-resume-parser:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=1
      - --concurrency=1
      - --min-instances=0
      - --max-instances=3
      - --timeout=120
      - --set-env-vars=KARTA_ORIGIN=https://hiring-scorer.vercel.app
